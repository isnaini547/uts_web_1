
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Pemesanan - TokoBuku</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .total {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>Laporan Pemesanan</h1>
        <p>Daftar pesanan yang sudah dimasukkan melalui Checkout.</p>

        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Nomor DO</th>
                    <th>Nama Pemesan</th>
                    <th>Email</th>
                    <th>Judul Buku</th>
                    <th>Jumlah</th>
                    <th>Total</th>
                    <th>Pembayaran</th>
                </tr>
            </thead>
            <tbody id="daftarLaporan"></tbody>
        </table>

        <p class="total">
            Total seluruh pesanan: Rp <span id="totalLaporan">0</span>
        </p>

        <p><a href="dashboard.html">Kembali ke Dashboard</a></p>
    </main>

    <script>
        const dataPesanan = JSON.parse(
            localStorage.getItem("dataPesanan") || "[]"
        );

        const daftar = document.getElementById("daftarLaporan");
        let totalSemua = 0;

        if (dataPesanan.length === 0) {
            daftar.innerHTML = `
                <tr>
                    <td colspan="8">Belum ada data pemesanan.</td>
                </tr>
            `;
        } else {
            dataPesanan.forEach((pesanan, index) => {
                const total = pesanan.jumlah * pesanan.harga;
                totalSemua += total;

                const baris = document.createElement("tr");

                const dataKolom = [
                    index + 1,
                    pesanan.nomorDO || "-",
                    pesanan.nama,
                    pesanan.email,
                    pesanan.judulBuku,
                    pesanan.jumlah,
                    "Rp " + total.toLocaleString("id-ID"),
                    pesanan.pembayaran
                ];

                dataKolom.forEach(nilai => {
                    const kolom = document.createElement("td");
                    kolom.textContent = nilai;
                    baris.appendChild(kolom);
                });

                daftar.appendChild(baris);
            });
        }

        document.getElementById("totalLaporan").textContent =
            totalSemua.toLocaleString("id-ID");
    </script>
</body>
</html>
