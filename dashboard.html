
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TokoBuku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            border-radius: 12px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .menu a {
            display: block;
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-decoration: none;
            color: #1e40af;
            box-shadow: 0 3px 10px #00000010;
        }

        .menu a:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dashboard TokoBuku</h1>
        <p id="greeting"></p>
    </header>

    <main>
        <h2>Menu Utama</h2>

        <nav class="menu">
            <a href="stok.html">
                <h3>Informasi Stok/Katalog</h3>
                <p>Lihat daftar buku dan stok.</p>
            </a>

            <a href="tracking.html">
                <h3>Tracking Pengiriman</h3>
                <p>Periksa status pengiriman buku.</p>
            </a>
    
            <a href="chakout.html">
    <h3>Chackout / Pemesanan</h3>
    <p>Tambah dan kelola pesanan buku.</p>
</a>

           

<a href="laporan.html">
    <h3>Laporan Pemesanan</h3>
    <p>Lihat dan kelola pesanan.</p>
</a>

<a href="history.html">
    <h3>History Transaksi</h3>
    <p>Lihat riwayat transaksi.</p>
</a>
        </nav>
    </main>


    <script>
        const jam = new Date().getHours();
        let sapaan;

        if (jam < 11) {
            sapaan = "Selamat pagi!";
        } else if (jam < 15) {
            sapaan = "Selamat siang!";
        } else if (jam < 18) {
            sapaan = "Selamat sore!";
        } else {
            sapaan = "Selamat malam!";
        }

        document.getElementById("greeting").textContent =
            sapaan + " Selamat datang di TokoBuku.";
    </script>

</body>
</html>
